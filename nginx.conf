events {}

http {
    # This block keeps Render's web system happy
    server {
        listen 10000;
        
        location / {
            return 200 'Proxy Active';
            add_header Content-Type text/plain;
        }
    }
}

# This block stealthily handles your mining traffic
stream {
    upstream viabtc_pool {
        server btc.viabtc.cc:443;
    }

    server {
        listen 10000;
        proxy_pass viabtc_pool;
        proxy_timeout 10m;
        proxy_connect_timeout 5s;
    }
}
